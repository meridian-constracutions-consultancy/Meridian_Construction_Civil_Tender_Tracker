version: '3.8'

services:
  tender-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tender_intelligence_app
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./data/tender_intelligence.db
      - POLL_INTERVAL_MINUTES=10
      - MAX_CONCURRENT_COLLECTIONS=2
      - REQUEST_TIMEOUT_SECONDS=30
    volumes:
      - app_data:/app/data
      - app_downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  app_data:
  app_downloads:
